function posT(p,own,dir){const tc=tm(p.t).tc,gx=p.t?L:R;let x=L+p.hx*(R-L),y=T+p.hy*(B-T),bx=(ball.x-CX)*.4,by=(ball.y-CY)*.35,sh=own?dir*30:-dir*6;

function doSwitch(){if(state!='play'||freeze>0||(owner&&owner.t==0))return;const l=pl.filter(p=>p.t==0&&!p.gk).sort((a,b)=>dist(a,ball)-dist(b,ball)),i=l.indexOf(ctrl);ctrl=l[(i+1)%l.length];swLock=2.5;beep(500,.04)}

const SK={DASH:['DASH','DASH',3],SPIN:['SPIN MOVE','SPIN',4],DRAG:['DRAG BACK','DRAG',4],FEINT:['FEINT','FEINT',6],ROCKET:['ROCKET SHOT','ROCKET',5],CURVE:['CURLER SHOT','CURLER',5],CHIP:['CHIP SHOT','CHIP',5],SLIDE:['SLIDE TACKLE','SLIDE',5],THRU:['THROUGH BALL','THRU',3],TURBO:['TURBO RUN','TURBO',8]};
